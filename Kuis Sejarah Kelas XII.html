["Pada 1942 Jepang menduduki Indonesia, membubarkan organisasi politik, membentuk PUTERA dan PETA, sementara rakyat tertekan kerja paksa dan kekurangan pangan. Manakah pernyataan yang sesuai dengan cara berpikir sejarah sinkronik?",["Dampak kebijakan Jepang terhadap perlawanan rakyat","Perubahan organisasi dari masa Belanda ke masa Jepang","Peristiwa dari masa pra-kemerdekaan hingga masa kemerdekaan","Perkembangan politik dari zaman penjajahan hingga kemerdekaan","Kondisi sosial, politik, dan ekonomi dalam satu masa pemerintahan"],4,"Sinkronik melihat keterkaitan berbagai aspek (sosial, politik, ekonomi) dalam satu kurun waktu. Pilihan lain menelusuri perubahan antarwaktu (diakronik)."],
["Banten, bekas wilayah Pajajaran yang ditaklukkan Demak, tumbuh menjadi pelabuhan penting di Selat Sunda setelah Malaka jatuh ke Portugis (1511). Faktor utama yang mendorong perkembangan ekonomi Banten adalah...",["Pedagang India dan Arab tidak berlabuh lagi di Malaka setelah dikuasai Portugis","Majapahit memburuk sehingga Banten menjadi pusat baru","Banten merupakan pelabuhan khusus bagi pedagang Eropa","Banten dikuasai penuh oleh Kerajaan Pajajaran","Banten menutup diri dari perdagangan internasional"],0,"Pedagang Muslim menghindari Malaka dan beralih ke Banten. Lada yang melimpah juga menjadi daya tarik tambahan."],
["Demak berasal dari wilayah Majapahit dan didirikan Raden Fatah sebagai kerajaan Islam. Faktor yang membuat Demak berperan penting di bidang ekonomi adalah...",["Situasi politik Banten kacau sehingga Demak menjadi pusat baru","Demak memiliki komoditas ekspor seperti beras, kain tenun, lilin, kayu jati, dan garam","Demak memonopoli rempah-rempah Maluku","Demak menutup pelabuhan bagi pedagang asing","Demak hanya mengandalkan perdagangan dengan Eropa"],1,"Demak memiliki daerah pertanian luas dan beragam komoditas ekspor, serta menjadi penghubung perdagangan timur-barat Nusantara."],
["Pada April 1595 Belanda berlayar menuju Nusantara dipimpin Cornelis de Houtman melalui Tanjung Harapan dan tiba di Banten (1596). Apa tujuan utama Belanda datang ke Nusantara?",["Membuktikan kegemilangan dunia Timur","Menunjukkan kehebatan Eropa di mata Asia","Menguasai bandar perdagangan di Malaka","Mencari sumber penghasil rempah-rempah","Melakukan eksplorasi untuk kepentingan Belanda"],3,"Motif utama bangsa Eropa adalah ekonomi: mencari langsung sumber rempah-rempah yang sangat berharga di Eropa."],
["Teuku Abdul Jalil memimpin perlawanan di Aceh menghadapi pendudukan Jepang (Bayu, 1942). Apa alasan perlawanannya?",["Didirikannya guseikanbu (pusat militer)","Penerapan Seikerei (membungkuk ke arah timur matahari)","Praktik Jugun Ianfu (perbudakan perempuan)","Dibentuknya Kumiai (lembaga ekonomi)","Kewajiban Tencosetsu (hari raya ulang tahun kaisar)"],1,"Seikerei bertentangan dengan keyakinan agama rakyat Aceh yang religius, sehingga memicu perlawanan."],
["Ki Hajar Dewantara memperjuangkan kemerdekaan lewat pendidikan, pers, dan diplomasi, serta mendirikan Taman Siswa. Manakah pernyataan yang mencerminkan idenya dan masih relevan hingga kini?",["Pentingnya pendidikan sebagai alat membangun bangsa","Menggunakan segala cara untuk mencapai tujuan yang diinginkan","Mempertahankan semua tradisi dari generasi sebelumnya","Mengutamakan kepentingan golongan sendiri","Menolak pendidikan bagi rakyat kecil"],0,"Taman Siswa menegaskan pendidikan nasional sebagai fondasi pembangunan bangsa dan perlawanan terhadap diskriminasi kolonial."],
["Tritura adalah respons mahasiswa pasca G30S 1965. Manakah yang termasuk peristiwa penting titik awal lahirnya Orde Baru?",["Dikeluarkannya Surat Perintah Sebelas Maret oleh Presiden Soekarno","Penetapan Dewan Jenderal oleh Presiden Soekarno","Dekrit Presiden 5 Juli 1959","Konferensi Asia Afrika 1955","Pembentukan Kabinet Dwikora"],0,"Supersemar (11 Maret 1966) memberi wewenang kepada Soeharto sehingga ia membubarkan PKI. Dewan Jenderal hanyalah isu, bukan penetapan resmi."],
["Menurut Herodotus, sejarah tidak bergerak maju dengan tujuan pasti, tetapi seperti garis lingkaran yang tinggi rendahnya diakibatkan keadaan manusia. Apa fokus pengertian sejarah menurut pendapat tersebut?",["Hasil penafsiran subjektif para penulis masa lalu","Kumpulan fakta masa lampau yang dikaji secara sistematis","Bentuk ekspresi imajinatif dalam tulisan atau sastra","Cerita turun-temurun melalui narasi rakyat","Peristiwa yang berlangsung dan berulang dalam kehidupan manusia"],4,"Pandangan siklus (lingkaran) menekankan peristiwa yang berulang dalam kehidupan manusia."],
["Seorang siswa membandingkan naskah pidato asli Presiden Soekarno pada Konferensi Asia Afrika 1955 dengan buku sejarawan tahun 2015. Bagaimana perbedaan karakteristik keduanya?",["Keduanya berbobot sama karena topiknya identik","Buku lebih benar karena ditulis dengan jarak waktu","Naskah pidato selalu lebih akurat karena ditulis tokoh penting","Buku lebih dalam karena hanya satu sudut pandang","Naskah pidato adalah sumber primer (pandangan langsung pelaku), sedangkan buku sumber sekunder yang bersifat retrospektif"],4,"Sumber primer dibuat sezaman oleh pelaku/saksi; sumber sekunder disusun kemudian berdasarkan sumber lain dan memuat interpretasi penulis."],
["Relief Karmawibhangga Panel 65 Candi Borobudur menggambarkan aktivitas masyarakat Jawa Kuno. Penggambaran yang tepat tentang kehidupan sosial masyarakat adalah...",["Anjing dijadikan penjaga sawah dari hama","Masyarakat belum mengenal penyimpanan padi","Padi satu-satunya tanaman yang dibudidayakan","Padi dijadikan persembahan kepada Dewa","Masyarakat Jawa Kuno sudah menghadapi hama tikus ketika membudidayakan padi di sawah"],4,"Relief menunjukkan sawah dengan tikus, bukti bahwa pertanian padi sudah maju dan menghadapi hama."],
["Beberapa ahli berpendapat Islam dibawa pedagang dari Gujarat. Apa bukti yang mendukung teori Gujarat?",["Makam Sunan Ampel di Surabaya","Nisan Syekh Rukunuddin di Barus","Nisan Syekh Jumadil Kubro di Troloyo","Makam Fatimah Binti Maimun di Gresik","Nisan Sultan Malik Al-Saleh di Samudra Pasai"],4,"Batu nisan Sultan Malik Al-Saleh (1297) bercorak mirip nisan Cambay, Gujarat, sehingga mendukung teori Gujarat."],
["Sumpah Pemuda (28 Oktober 1928) hasil Kongres Pemuda II menyatukan pemuda berbagai suku dan bahasa. Bagaimana perbandingan persatuan dan nasionalisme sebelum dan sesudahnya?",["Sebelumnya berjuang untuk daerah masing-masing, sesudahnya muncul perasaan sebagai satu bangsa","Sebelumnya berjuang untuk kolonialisme, sesudahnya untuk kelompok masing-masing","Sebelumnya berjuang untuk daerah, sesudahnya tidak ada perubahan tujuan","Sebelumnya sudah berjuang bersama sebagai bangsa, sesudahnya tidak ada perbedaan","Sebelumnya muncul perasaan satu bangsa, sesudahnya semakin kuat"],0,"Sebelum 1928 perjuangan bersifat kedaerahan; Sumpah Pemuda melahirkan identitas bangsa Indonesia."],
["Surabaya, kota pelabuhan makmur, ditaklukkan Mataram di bawah Sultan Agung setelah pengepungan 1620-1625. Bagaimana pengaruhnya terhadap ekonomi Nusantara?",["Mataram menjadi pusat baru perekonomian lewat perdagangan rempah Indonesia Timur","Surabaya tetap menjadi pelabuhan dominan di Jawa Timur","Surabaya kehilangan peran sebagai pelabuhan penting, dan ekonomi pesisir mengalami kemunduran","Mataram menjadi pusat pelayaran antarregional menggantikan Surabaya","Surabaya berkembang pesat sebagai pusat rempah"],2,"Mataram berorientasi agraris, sehingga penaklukan membuat pelabuhan Surabaya dan kota-kota pesisir melemah."],
["Gajah Mada, Mahapatih Majapahit, mengucapkan Sumpah Palapa untuk menyatukan Nusantara. Manakah penafsiran yang paling tepat mengenai Sumpah Palapa?",["Bertujuan menyatukan Nusantara dan mencerminkan luhurnya cita-cita Majapahit","Berfokus hanya pada perluasan wilayah daratan","Bertujuan mengakhiri kekuasaan Hayam Wuruk","Dibuat untuk memutus hubungan dengan kerajaan lain","Bertujuan menutup jalur pelayaran"],0,"Sumpah Palapa adalah tekad pemersatuan Nusantara, termasuk wilayah maritim, bukan sekadar daratan."],
["Bangsa Spanyol melakukan penjelajahan samudra (Columbus, Pizarro, Magellan). Manakah jalur pelayaran Spanyol hingga tiba di Nusantara?",["Eropa-Samudra Atlantik-Benua Amerika-Samudra Pasifik-Filipina-Malaka","Eropa-Samudra Atlantik-Benua Amerika-Samudra Pasifik-Filipina-Maluku","Eropa-Samudra Atlantik-Benua Amerika-Samudra Pasifik-Goa India-Malaka","Eropa-Pantai Barat Afrika-Tanjung Harapan-Kalikut India-Malaka","Eropa-Pantai Barat Afrika-Tanjung Harapan-Pantai Timur Afrika-Maluku"],1,"Spanyol berlayar ke arah barat melintasi Atlantik, Amerika, lalu Pasifik, tiba di Filipina dan Maluku. Rute lewat Tanjung Harapan ditempuh Portugis dan Belanda."],
["Walisongo menyebarkan Islam di Jawa melalui pendekatan budaya seperti wayang dan seni pertunjukan. Manakah pernyataan yang tepat tentang jejak budaya Islam di Jawa?",["Wayang dari gambar manusia diubah menjadi bentuk dekoratif, dan tembang Jawa dipakai untuk menyampaikan tuntunan hidup","Tari Sanghyang dipentaskan pada upacara keagamaan Islam tradisional","Wayang dilarang sepenuhnya","Seni pertunjukan dihapus dari dakwah","Hanya menggunakan bahasa Arab dalam dakwah"],0,"Wayang disesuaikan dengan ajaran Islam dan tembang Jawa dipakai untuk dakwah. Tari Sanghyang adalah tradisi Bali (Hindu)."],
["Poenale sanctie dilakukan di perkebunan Sumatera Timur akhir abad ke-19 kepada pekerja yang dianggap melanggar aturan. Manakah pengaruh paling tepat terhadap kehidupan pekerja?",["Membuat para pekerja kehilangan kemerdekaannya","Menurunkan produktivitas dan kesejahteraan para kuli","Menciptakan kesenjangan baru antara kuli dengan pegawai Eropa","Menjadi bentuk eksploitasi karena tidak bisa istirahat atau libur","Menjadi bentuk penindasan yang menimbulkan ketakutan di kalangan pekerja perkebunan"],4,"Ilustrasi hukuman fisik menunjukkan penindasan yang menanamkan ketakutan pada kuli kontrak."],
["Perang Tellumpoccoe (1582-1611) terjadi antara Gowa-Tallo dan aliansi Bugis (Bone, Wajo, Soppeng). Bagaimana dampaknya bagi ekonomi Nusantara?",["Kemenangan Gowa-Tallo memperkuat kontrol atas jalur perdagangan rempah di Indonesia Timur","Posisi kerajaan Bugis menguat dalam perdagangan internasional","Bone menjadi penguasa jalur pelayaran sekitar Sulawesi Selatan","Perdagangan lokal Sulawesi Selatan menjadi lebih bebas dan tidak terpusat","Wajo menjadi pusat perdagangan rempah terbesar"],0,"Gowa-Tallo menang pada 1611 dan Makassar menjadi pusat perdagangan rempah Indonesia Timur."],
["Peristiwa di Laut Tengah tahun 1453 turut melatarbelakangi kedatangan bangsa Eropa ke Nusantara. Peristiwa apa itu?",["Persaingan dagang sesama bangsa Eropa","Pencarian sumber daya alam seperti logam mulia","Keinginan memperluas wilayah kekuasaan","Dorongan melanjutkan Perang Salib","Jatuhnya Konstantinopel ke tangan Turki Usmani"],4,"Jatuhnya Konstantinopel menutup jalur dagang Eropa ke Asia, sehingga Eropa mencari jalur sendiri ke dunia Timur."],
["Mohammad Hatta menekankan koperasi sebagai pilar ekonomi kerakyatan. Jika Anda ingin menghidupkan semangatnya kini, tindakan manakah yang tepat?",["Mendirikan koperasi digital untuk memberdayakan UMKM lokal","Menggalang dana investor asing untuk mendominasi pasar lokal","Mendorong penguasaan pasar oleh korporasi besar","Menolak semua kerja sama antarbangsa","Mengutamakan keuntungan pribadi semata"],0,"Koperasi menekankan kebersamaan dan kekuatan ekonomi rakyat, bukan dominasi modal besar."],
["Persaingan Portugis dan Spanyol di Maluku diakhiri Perjanjian Saragosa 1529; Portugis memonopoli perdagangan dan mengancam raja-raja Maluku. Strategi apa yang digunakan rakyat Maluku?",["Perlawanan terbuka lewat serangan militer darat dan laut terhadap Portugis","Bekerja sama dengan penguasa Papua, Jawa, dan Sumatra untuk menyeimbangkan pengaruh asing","Membuat perjanjian monopoli dengan Portugis","Menyerahkan kedaulatan kepada Portugis","Bergabung dengan Spanyol di Filipina"],0,"Rakyat Maluku (misalnya Sultan Khairun dan Baabullah) melawan Portugis secara terbuka dengan kekuatan militer."],
["Perlawanan Kiai Zainal Mustafa di Singaparna (Februari 1944) menentang kebijakan Jepang. Apa yang mendorong perlawanan tersebut?",["Perlakuan militer Jepang yang menyebabkan penderitaan rakyat","Sistem sewa tanah yang menjerat rakyat dengan hutang","Rakyat wajib membayar pajak kepada Jepang dalam bentuk uang","Kelaparan akibat tanam paksa (Cultuur stelsel)","Pembentukan Volksraad"],0,"Penderitaan rakyat akibat kerja paksa, penyerahan hasil bumi, dan seikerei mendorong perlawanan. Sewa tanah dan tanam paksa adalah kebijakan masa kolonial Belanda/Inggris."],
["Setelah proklamasi 17 Agustus 1945, rakyat mempertahankan kemerdekaan dari Belanda. Manakah perjuangan fisik rakyat melawan Belanda?",["Pertempuran 10 November 1945","Pemberontakan Andi Azis","Pemberontakan Republik Maluku Selatan","Perjanjian Linggarjati","Peristiwa Rengasdengklok"],0,"Pertempuran Surabaya adalah perlawanan fisik. Andi Azis dan RMS adalah ancaman dari dalam, Linggarjati adalah diplomasi."],
["Jepang menjadi negara industri karena Restorasi Meiji dan butuh modal sehingga berekspansi ke Indonesia. Apa karakteristik kebijakan Jepang pada masyarakat saat menjajah Indonesia?",["Mengutamakan kegiatan ekonomi untuk kepentingan militer (perang)","Menjalankan Politik Etis (irigasi, edukasi, emigrasi)","Menerapkan tanam paksa untuk Belanda","Memberi kebebasan berpolitik penuh","Membiarkan rakyat mengelola sumber daya sendiri"],0,"Ekonomi dikerahkan untuk kebutuhan perang Jepang di Pasifik, antara lain lewat kerja paksa dan penyerahan padi."],
["Pada masa Demokrasi Liberal, program ekonomi pemerintah seperti Gerakan Benteng memberi lisensi impor kepada pengusaha pribumi. Manakah dampak negatif kebijakan tersebut?",["Pemberian lisensi impor Gerakan Benteng tidak efektif membangkitkan jiwa wirausaha kaum pribumi","Rencana Sumitro berkontribusi bagi seluruh lapisan masyarakat","Biro Perancang Negara menurunkan defisit anggaran","Industrialisasi dasar langsung menyejahterakan semua rakyat","Defisit anggaran turun dari 100 persen menjadi 20 persen"],0,"Pengusaha pribumi hanya jadi perantara lisensi, sehingga jiwa wirausaha tidak tumbuh. Defisit anggaran justru naik (20% tahun 1950 menjadi 100% tahun 1960)."],
["Ekonomi Kerakyatan digagas Mohammad Hatta (koperasi, kebersamaan, kepentingan umum). Manakah yang mencerminkan nilai semangat ekonomi Bung Hatta?",["Pemberian investasi gratis untuk kalangan pengusaha makro","Deregulasi total yang mengabaikan perlindungan usaha mikro","Pengembangan koperasi pekerja di sektor informal","Penguasaan pasar oleh korporasi besar","Persaingan bebas tanpa perlindungan rakyat kecil"],2,"Koperasi pekerja sektor informal memberdayakan rakyat kecil sesuai ekonomi kerakyatan."],
["Agresi Militer Belanda II (10 Desember 1948) menawan Presiden dan Wakil Presiden. Syafruddin Prawiranegara membentuk PDRI, Panglima Soedirman bergerilya. Apa respons strategis bangsa Indonesia?",["Mendirikan pemerintahan federal di luar Jawa untuk mendapat pengakuan Belanda","Menawarkan negara bersama di bawah pengawasan Dewan Keamanan PBB","Menyelamatkan pemerintahan lewat PDRI, bergerilya, dan menekan Belanda dengan diplomasi","Beraliansi dengan negara boneka bentukan Belanda","Memindahkan kekuasaan ke negara bagian yang belum diduduki"],2,"Tiga jalur berjalan serentak: pemerintahan darurat (PDRI), perang gerilya, dan diplomasi internasional."],
["Supersemar (11 Maret 1966) memberi wewenang luas kepada Letjen Soeharto menjaga stabilitas negara. Bagaimana akibatnya sehingga mendorong lahirnya Orde Baru?",["Soeharto leluasa membubarkan PKI dan menahan menteri yang dianggap terlibat G30S","Supersemar langsung menjadikan Soeharto Presiden RI","Supersemar memberi Soeharto mandat tanpa batas waktu sebagai raja","Soekarno menyerahkan jabatan seketika","Supersemar membubarkan MPRS"],0,"Supersemar adalah surat perintah, bukan penyerahan jabatan. Soeharto menjadi Presiden lewat keputusan MPRS (1967-1968)."],
["Perhatikan kutipan: \"Pembangunan mercusuar dianggap cara menunjukkan keunggulan Indonesia di mata dunia, namun biaya besar menyebabkan krisis ekonomi semakin parah.\" Apa kelemahan utama Politik Mercusuar Soekarno?",["Proyek besar gagal menarik dukungan negara Blok Timur","Dana pembangunan dialihkan untuk subsidi pangan","Citra internasional Indonesia menguat, tetapi perekonomian rakyat memburuk","Proyek skala nasional berhasil menurunkan inflasi dengan cepat","Pemerintah berhasil mengintegrasikan petani dan buruh"],2,"Proyek prestise (misal Asian Games, Monas) menguras anggaran, inflasi melonjak, rakyat kesulitan."],
["Setelah pemilu 1971, pemerintah Orde Baru menyederhanakan partai politik karena dianggap menghambat pembangunan. Apa langkah pemerintah?",["Empat partai berhaluan Islam bergabung dalam Partai Persatuan Pembangunan (PPP)","Lima partai Islam bergabung dalam PPP","Empat partai non-Islam bergabung dalam PDI","Dibentuk Badan Pengawas Pemilu tingkat nasional dan daerah","Calon presiden diusulkan sepuluh partai politik"],0,"Fusi 1973: NU, Parmusi, PSII, Perti menjadi PPP; PNI, IPKI, Murba, Parkindo, Partai Katolik menjadi PDI (lima partai); Golkar sebagai kekuatan sipil lainnya."]
];

<h1 class="text-3xl font-black mt-2" style="color:var(--pr)">Kuis Sejarah Seru!</h1><p style="color:var(--mu)">Kelas XII • ${Q.length} soal • 5 pilihan jawaban</p>
<div class="mt-4 text-left space-y-3"><label class="font-bold">Nama lengkap<input id="nm" placeholder="Contoh: Budi Santoso"></label><label class="font-bold">Kelas<input id="kl" placeholder="Contoh: XII IPS 2"></label></div>
<div class="mt-5 flex flex-wrap gap-3 justify-center"><button class="btn g" onclick="start()">🚀 Mulai Kuis</button>${snBtn()}<button class="btn" style="background:#0ea5e9" onclick="st.view='guru';sfx.tap();go()">👩‍🏫 Dasbor Guru</button></div>
<p id="er" class="mt-3 font-bold" style="color:var(--no)"></p></div>`}
function start(){const n=$("#nm").value.trim(),k=$("#kl").value.trim();if(!n||!k){$("#er").textContent="Isi nama dan kelas dulu ya 😊";sfx.no();return}
ac.resume&&ac.resume();Object.assign(st,{n,k,i:0,sc:0,ans:[],done:false,started:true,view:""});sfx.tap();go()}
function soal(){const q=Q[st.i],p=Math.round(st.i/Q.length*100);
A.innerHTML=`<div class="flex justify-between items-center mb-2"><b>👦 ${st.n} • ${st.k}</b>${snBtn()}</div>
<div class="w-full h-4 rounded-full" style="background:var(--bd)"><div class="h-4 rounded-full" style="width:${p}%;background:var(--pr);transition:.4s"></div></div>
<div class="card mt-3"><p class="font-extrabold" style="color:var(--pr)">Soal ${st.i+1} dari ${Q.length} • ⭐ ${st.sc}</p><p class="mt-2 font-semibold leading-relaxed">${q[0]}</p>
${q[1].map((o,j)=>`<button class="opt" onclick="pick(${j})"><b>${L[j]}</b><span>${o}</span></button>`).join("")}<div id="fb"></div></div>`}
function pick(j){const q=Q[st.i],ok=j===q[2];if(ok)st.sc++;st.ans.push({q:st.i+1,p:L[j],b:L[q[2]],ok});
document.querySelectorAll(".opt").forEach((b,x)=>{b.disabled=true;if(x===q[2])b.classList.add("ok");else if(x===j)b.classList.add("no")});
ok?sfx.ok():sfx.no();const r=a=>a[Math.floor(Math.random()*a.length)];
$("#fb").innerHTML=`<div class="mt-4 p-3 rounded-2xl font-semibold" style="background:${ok?"#dcfce7":"#ffe4e6"};color:${ok?"#14532d":"#881337"}"><p class="text-lg font-black">${ok?r(OK):r(NO)}</p><p>${ok?"":`Jawaban yang benar: <b>${L[q[2]]}</b>. `}${q[3]}</p></div>
<button class="btn mt-4 w-full" onclick="nxt()">${st.i+1<Q.length?"Soal berikutnya ➡️":"Lihat hasil 🏆"}</button>`}
async function nxt(){sfx.tap();if(++st.i<Q.length)return soal();st.done=true;sfx.win();
const r={nama:st.n,kelas:st.k,benar:st.sc,total:Q.length,nilai:Math.round(st.sc/Q.length*100),waktu:new Date().toLocaleString("id-ID"),ts:Date.now()};
st.sv=await save(r);hasil()}
function hasil(){const v=Math.round(st.sc/Q.length*100);
A.innerHTML=`<div class="card text-center mt-6"><div class="text-6xl">${v>=75?"🏆":v>=50?"🌟":"💪"}</div><h2 class="text-2xl font-black">Selesai, ${st.n}!</h2>
<p class="text-5xl font-black my-2" style="color:var(--pr)">${v}</p><p>Benar ${st.sc} dari ${Q.length} soal</p>
<p class="mt-2">${v>=75?"Kamu sangat menguasai materi!":v>=50?"Bagus! Sedikit lagi, ulangi materi yang kurang.":"Tetap semangat, belajar lagi pasti bisa!"}</p>
<p class="text-xs mt-2" style="color:var(--mu)">Nilai tersimpan (${st.sv||"lokal"}).</p>
<button class="btn mt-4" onclick="st={n:'',k:'',i:0,sc:0,ans:[],snd:st.snd,done:false};go()">🔄 Main lagi</button></div>`}
let unsub=null;
function guru(){A.innerHTML=`<div class="card mt-4"><div class="flex justify-between flex-wrap gap-2"><h2 class="text-xl font-black">👩‍🏫 Dasbor Guru (real-time)</h2><button class="btn alt text-sm" onclick="st.view='';unsub&&unsub();go()">⬅️ Kembali</button></div>
<p class="text-xs" style="color:var(--mu)" id="info"></p><div class="flex flex-wrap gap-2 my-3"><button class="btn text-sm g" onclick="ex('xlsx')">📗 Excel</button><button class="btn text-sm" style="background:#dc2626" onclick="ex('pdf')">📕 PDF</button><button class="btn text-sm" style="background:#2563eb" onclick="ex('doc')">📘 Word</button></div>
<div id="tb" class="overflow-x-auto"></div></div>`;
const draw=rows=>{store=rows.sort((a,b)=>b.ts-a.ts);const n=rows.length,av=n?Math.round(rows.reduce((s,r)=>s+r.nilai,0)/n):0;
$("#tb").innerHTML=`<p class="font-bold mb-1">Peserta: ${n} • Rata-rata: ${av}</p><table><tr><th>#</th><th>Nama</th><th>Kelas</th><th>Benar</th><th>Nilai</th><th>Waktu</th></tr>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td>${r.benar}/${r.total}</td><td><b>${r.nilai}</b></td><td>${esc(r.waktu)}</td></tr>`).join("")||"<tr><td colspan=6>Belum ada data.</td></tr>"}</table>`};
if(db){$("#info").textContent="☁️ Tersinkron dengan cloud database. Hanya pemilik artifact (guru) yang dapat membaca data.";
try{unsub=db.collection("results").onSnapshot(s=>draw(s.docs.map(d=>d.data())),e=>{$("#info").textContent="Tidak dapat membaca cloud (khusus guru/pemilik): "+(e.message||e.code)})}catch(e){draw([])}}
else{$("#info").textContent="⚠️ Cloud tidak tersedia di tampilan ini; menampilkan data lokal perangkat.";draw(lsGet())}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function dl(name,data){try{const d=await claude.use("downloads");if(d){await d.save({filename:name,data});return}}catch(e){}
const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement("a");a.href=u;a.download=name;a.click()}
async function ex(t){const H=["No","Nama","Kelas","Benar","Total","Nilai","Waktu"],R=store.map((r,i)=>[i+1,r.nama,r.kelas,r.benar,r.total,r.nilai,r.waktu]);
if(t==="xlsx"){const w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([H,...R]),"Nilai");await dl("rekap-nilai-sejarah.xlsx",new Blob([XLSX.write(w,{type:"array",bookType:"xlsx"})]))}
if(t==="pdf"){const d=new jspdf.jsPDF();d.text("Rekap Nilai Kuis Sejarah Kelas XII",14,15);d.autoTable({head:[H],body:R,startY:22});await dl("rekap-nilai-sejarah.pdf",d.output("blob"))}
if(t==="doc"){const h=`<html><head><meta charset="utf-8"></head><body><h2>Rekap Nilai Kuis Sejarah Kelas XII</h2><table border="1" cellpadding="4" style="border-collapse:collapse"><tr>${H.map(x=>`<th>${x}</th>`).join("")}</tr>${R.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></body></html>`;await dl("rekap-nilai-sejarah.doc",new Blob([h],{type:"application/msword"}))}}
</script></body></html>
